<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - SmartCalendar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-page">
    <header>
        <div class="logo">Smart<span>Admin</span></div>
        <a href="index.html" class="btn-sec">Voltar ao Calendário</a>
    </header>

    <main class="admin-container">
        <section class="admin-card">
            <h3>Novo Usuário</h3>
            <div class="admin-form">
                <input type="text" id="new-username" placeholder="robson">
                <input type="password" id="new-password" placeholder="Senha">
                <div class="checkbox-group">
                    <label><input type="checkbox" id="new-is-admin"> Admin</label>
                    <label><input type="checkbox" id="new-can-edit" checked> Editor</label>
                </div>
                <button id="btn-create-user" class="btn-primary">Criar</button>
            </div>
        </section>

        <section class="admin-card">
            <h3>Membros do Sistema</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Usuário</th>
                            <th>Admin</th>
                            <th>Editor</th>
                            <th>Cor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="admin.js"></script>
</body>
</html>
